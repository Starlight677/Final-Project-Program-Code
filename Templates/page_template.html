<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planetary Simulator App</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        .background_image {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-image: url("/media/GasGiantMoons.png");
        }

        .nav-btn {
            position: absolute;
            height: 10vh;
            width: 10vw;
            text-align: center;
            border: 2px solid black;
            padding: 5px;
            border-radius: 5vh;
        }

        .btn-menu { top: 85vh; left: 2vw; }
        .btn-action-right { top: 85vh; left: 85vw; }

        .panel {
            position: absolute;
            width: 15vw;
            text-align: center;
            border: 2px solid black;
            background-color: white;
            overflow: auto;
            display: block;
            padding: 5px;
            border-radius: 5vh;
        }

        .panel-left { top: 15vh; left: 5vw; height: 45vh; }
        .panel-right { top: 15vh; left: 78vw; height: 45vh; }
        .panel-center { top: 30vh; left: 42vw; }

        .choice-list {
            position: absolute;
            top: 5vh;
            left: 2vw;
            height: 70vh;
            text-align: center;
            overflow: auto;
            display: block;
        }

        .choice-item {
            position: relative;
            height: 10vh;
            width: 15vw;
            border: 2px solid black;
            padding: 5px;
            text-align: center;
            background-color: white;
            border-radius: 15px;
        }

        .choice-item:not(.selected):hover {
            background-color: silver;
        }

        .choice-item.selected {
            background-color: grey;
        }

        .simulation-image-box {
            position: absolute;
            top: 0;
            left: 27vw;
            text-align: center;
        }

        .user-box {
            position: absolute;
            top: 10vh;
            left: 42vw;
            height: 15vh;
            width: 15vw;
            text-align: center;
            color: white;
            overflow: auto;
            display: block;
            padding: 5px;
            border-radius: 5vh;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="background_image"></div>
    {% block content %}{% endblock %}
    <script>
        const SIM_IMAGE_URL = "/media/latestSimulation{{ user|escapejs }}.png";
        function refreshSimImage() {
            $("#simImage").attr("src", SIM_IMAGE_URL + "?" + Date.now());
        }
        function bindAjaxForm(formSelector, url) {
            $(formSelector).on("submit", function(event) {
                event.preventDefault();
                $.ajax({
                    url: url,
                    type: "post",
                    cache: false,
                    data: $(this).serialize(),
                    success: refreshSimImage,
                    error: function() {
                        alert("Error in updating form.");
                    }
                });
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
