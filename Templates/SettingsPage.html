{% extends 'page_template.html' %}

{% block content %}
    <button class="nav-btn btn-menu" onclick="window.location.href='/'">
        Return to Main Menu
    </button>

    <form method="post" action="/settings/">
        {% csrf_token %}
        <ul class="choice-list">
            <li><h3 style="color:white">Simulation View Options:</h3></li>
            {% for style in graphStyles %}
                <li>
                    <button type="submit" name="styleIndex" value="{{ forloop.counter0 }}"
                            class="choice-item{% if forloop.counter0 == styleIndex %} selected{% endif %}">
                        {{ style }}
                    </button>
                </li>
            {% endfor %}
            <li><h3 style="color:white">Template Options:</h3></li>
            <li>
                <button type="submit" name="showExperimentalTemplates"
                        value="{% if showExperimentalTemplates %}0{% else %}1{% endif %}"
                        class="choice-item{% if showExperimentalTemplates %} selected{% endif %}">
                    Experimental Templates: {% if showExperimentalTemplates %}Enabled{% else %}Disabled{% endif %}
                </button>
            </li>
        </ul>
    </form>
{% endblock %}
