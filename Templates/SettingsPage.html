{% extends 'page_template.html' %}
{% load static %}

{% block content %}
    <style>
        .main_page_element {
            position: relative;
            height: 0;
            width: 0;
        }

        .return_home_button {
            position: absolute;
            top: 85vh;
            left: 2vw;
            height: 10vh;
            width: 10vw;
            text-align: center;
            border: 2px solid black;
            padding: 5px;
            border-radius: 5vh;
        }

        .choose_style_box {
            position: absolute;
            top: 5vh;
            left: 2vw;
            height: 70vh;
            text-align: center;
            overflow: auto;
            display: block;
        }

        .choose_style_entry {
            position: relative;
            height: 10vh;
            width: 15vw;
            border: 2px solid black;
            padding: 5px
            text-align: center;
            background-color: white;
            border-radius: 15px;
        }

        .selected_style_entry {
            position: relative;
            height: 10vh;
            width: 15vw;
            border: 2px solid black;
            padding: 5px
            text-align: center;
            background-color: grey;
            border-radius: 15px;
        }

        .choose_style_entry:hover {
            background-color: silver;
        }
    </style>
    <body>
        <button class="return_home_button"
                onclick="window.location.href='/'">
            Return to Main Menu
        </button>

        <ul class="choose_style_box">
            <li><h3 style="color:white">Simulation View Options:</h3></li>
            {% for style in graphStyles %}
                <li>
                    {% if forloop.counter0 == styleIndex %}
                        <button class="selected_style_entry"
                            onclick="window.location.href='/settings/{{forloop.counter0}}'">
                            {{style}}
                        </button>
                    {% else %}
                        <button class="choose_style_entry"
                            onclick="window.location.href='/settings/{{forloop.counter0}}'">
                            {{style}}
                        </button>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    </body>
{% endblock %}
