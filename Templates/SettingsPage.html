{% extends 'page_template.html' %}

{% block content %}
    <button class="nav-btn btn-menu" onclick="window.location.href='/'">
        Return to Main Menu
    </button>

    <ul class="choice-list">
        <li><h3 style="color:white">Simulation View Options:</h3></li>
        {% for style in graphStyles %}
            <li>
                <button class="choice-item{% if forloop.counter0 == styleIndex %} selected{% endif %}"
                        onclick="window.location.href='/settings/{{ forloop.counter0 }}'">
                    {{ style }}
                </button>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
