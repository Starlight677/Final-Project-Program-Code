{% extends 'page_template.html' %}
{% load static %}

{% block content %}
    <style>
        .main_page_element {
            position: relative;
            height: 0;
            width: 0;
        }

        .back_to_menu_button {
            position: absolute;
            top: 85vh;
            left: 5vw;
            height: 10vh;
            width: 10vw;
            text-align: center;
            border: 2px solid black;
            padding: 5px;
            border-radius: 5vh;
        }

        .back_to_login_button {
            position: absolute;
            top: 85vh;
            left: 85vw;
            height: 10vh;
            width: 10vw;
            text-align: center;
            border: 2px solid black;
            padding: 5px;
            border-radius: 5vh;
        }

        .register_form {
            position: absolute;
            top: 30vh;
            left: 42vw;
            height: 40vh;
            width: 15vw;
            text-align: center;
            border: 2px solid black;
            background-color: white;
            overflow: auto;
            display: block;
            padding: 5px;
            border-radius: 5vh;
        }

        .user_box {
            position: absolute;
            top: 10vh;
            left: 42vw;
            height: 15vh;
            width: 15vw;
            text-align: center;
            color: white;
            overflow: auto;
            display: block;
            padding: 5px;
            border-radius: 5vh;
        }
    </style>
    <body>
        <button class="back_to_menu_button"
                onclick="window.location.href='/'">
            Return to Main Menu
        </button>

        <button class="back_to_login_button"
                onclick="window.location.href='/login'">
            Return to Login Page
        </button>

        <div class="user_box">
            <h2>Current User: {{user}}</h2>
        </div>

        <form class ="register_form" action="" method="post">
            <h2>Create New Account:</h2>
            {% csrf_token %}
            {{ registerForm }}
            <input type="submit" value="Create">
        </form>
    </body>
{% endblock %}
