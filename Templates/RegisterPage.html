{% extends 'page_template.html' %}

{% block extra_styles %}
<style>
    .btn-auth-menu { top: 85vh; left: 5vw; }
    .auth-panel { height: 40vh; }
</style>
{% endblock %}

{% block content %}
    <button class="nav-btn btn-auth-menu" onclick="window.location.href='/'">
        Return to Main Menu
    </button>

    <button class="nav-btn btn-action-right" onclick="window.location.href='/login/'">
        Return to Login Page
    </button>

    <div class="user-box">
        <h2>Current User: {{ user }}</h2>
    </div>

    <form class="panel panel-center auth-panel" action="" method="post">
        <h2>Create New Account:</h2>
        {% csrf_token %}
        {{ registerForm }}
        <input type="submit" value="Create">
    </form>
{% endblock %}
