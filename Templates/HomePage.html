{% extends 'page_template.html' %}

{% block extra_styles %}
<style>
    .title-box {
        position: absolute;
        top: 15vh;
        left: 40vw;
        height: 20vh;
        width: 20vw;
        text-align: center;
    }

    .menu-btn { width: 30vw; left: 35vw; }
    .btn-new { top: 45vh; }
    .btn-load { top: 60vh; }
    .btn-settings { top: 75vh; }

    .login-btn {
        top: 10vh;
        left: 85vw;
        border-radius: 2vh;
    }
</style>
{% endblock %}

{% block content %}
    <div class="title-box">
        <h1 style="color:white">Welcome to the Planetary Orbit Simulator, {{ user }}!</h1>
    </div>

    <button class="nav-btn menu-btn btn-new" onclick="window.location.href='/create/'">
        Create New System
    </button>

    <button class="nav-btn menu-btn btn-load" onclick="window.location.href='/load/'">
        Load Existing System
    </button>

    <button class="nav-btn menu-btn btn-settings" onclick="window.location.href='/settings/'">
        Settings
    </button>

    <button class="nav-btn login-btn" onclick="window.location.href='/login/'">
        Login
    </button>
{% endblock %}
