{% extends 'page_template.html' %}

{% block content %}
    <button class="nav-btn btn-menu" onclick="window.location.href='/'">
        Return to Main Menu
    </button>

    <button class="nav-btn btn-action-right" onclick="window.location.href='/run/1/'">
        Run New Simulation
    </button>

    <ul class="choice-list">
        <li><h2 style="color:white">Select Template:</h2></li>
        {% for template in templatesList %}
            <li>
                <button class="choice-item{% if forloop.counter0 == templateIndex %} selected{% endif %}"
                        onclick="window.location.href='/create/{{ forloop.counter0 }}/'">
                    {{ template }}
                </button>
            </li>
        {% endfor %}
    </ul>

    <form class="panel panel-right" action="" method="post" id="submitForm">
        <h2>Simulation Options:</h2>
        <p>Default values will be used if none are provided.</p>
        {% csrf_token %}
        {{ form }}
        <p></p>
        <input type="submit" value="Confirm Changes">
    </form>

    <div class="simulation-image-box">
        <img src="/sim-image/" alt="This image has failed to load." id="simImage">
    </div>
{% endblock %}

{% block extra_scripts %}
<script>
    bindAjaxForm("#submitForm", "/runForm/1/");
</script>
{% endblock %}
